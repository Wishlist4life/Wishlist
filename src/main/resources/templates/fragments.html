<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">Wishlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=Source+Sans+3:wght@400;600&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/theme.css}"/>
</head>
<body>

<header class="site-header" th:fragment="nav">
    <nav class="nav" aria-label="Hovedmenu">
        <a class="nav__brand" th:href="@{/}">Wishlist</a>
        <div class="nav__links" th:unless="${loggedIn}">
            <a class="nav__link" th:href="@{/login}">Log ind</a>
            <a class="btn btn--small" th:href="@{/register}">Opret bruger</a>
        </div>
        <div class="nav__links" th:if="${loggedIn}">
            <a class="nav__link" th:href="@{/wishlists}">Mine ønskesedler</a>
            <form th:action="@{/logout}" method="post" class="inline-form">
                <button type="submit" class="nav__button">Log ud</button>
            </form>
        </div>
    </nav>
</header>

<footer class="site-footer" th:fragment="footer">
    <p>Wishlist4life, et skoleprojekt</p>
</footer>

</body>
</html>
