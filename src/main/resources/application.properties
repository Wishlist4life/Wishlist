spring.application.name=wishlist

spring.datasource.url=jdbc:mysql://wishlist4life-mysql.mysql.database.azure.com:3306/wishlist?useSSL=true&requireSSL=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Azure App Service ligger bag en proxy: brug X-Forwarded-* saa delings-links faar https og korrekt host
server.forward-headers-strategy=framework
